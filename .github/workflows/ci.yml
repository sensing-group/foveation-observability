name: ci

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: ./reproduce.sh

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    strategy:
      matrix:
        target: [esp32c5, esp32c3]
    steps:
      - uses: actions/checkout@v4
      - name: build
        shell: bash
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          if [ "${{ matrix.target }}" = "esp32c5" ]; then idf.py --preview set-target esp32c5; else idf.py set-target esp32c3; fi
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
